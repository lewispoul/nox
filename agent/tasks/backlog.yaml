- id: FILE-OPS-TEST
  title: Test file-ops system with simple enhancement
  priority: high
  scope:
    paths:
      - "nox/runners/xtb.py"
      - "nox/parsers/xtb_json.py"  
      - "tests/xtb/"
  done_when:
    - "files have proper TODO comments and test coverage"

- id: XTBA-001
  title: Wire real XTB runner and robust xtbout.json parser
  priority: medium
  scope:
    paths:
      - "nox/runners/xtb.py"
      - "nox/parsers/xtb_json.py"
      - "tests/xtb/"
  done_when:
    - "pytest -k xtb_end_to_end passes"
    - "endpoint /run_xtb returns energy, gap, dipole"

- id: JOBS-002
  title: Activate Dramatiq jobs from API with state polling
  priority: high
  status: COMPLETE
  scope:
    paths:
      - "api/routes/jobs.py"
      - "nox/jobs/"
      - "tests/jobs/"
  done_when:
    - "POST /jobs enqueues and /jobs/<id> shows states"
    - "GET /jobs/<id>/wait polls until completion or timeout"
  completion_notes:
    - "✅ Fixed artifacts endpoint pending-state race (test_artifacts_not_ready passing)"
    - "✅ Implemented GET /jobs/{id}/wait endpoint with configurable timeout (default 30s, max 300s)"
    - "✅ Polls every 500ms until terminal state (completed/failed) or timeout"
    - "✅ Returns JobStatus with final state or timeout message"
    - "✅ Comprehensive test suite: 5 new polling tests, all passing"
    - "✅ Full jobs test suite: 28 tests passing"

- id: CUBE-003
  title: Generate HOMO and LUMO .cube artifacts from XTB
  priority: medium
  status: COMPLETE
  scope:
    paths:
      - "nox/runners/xtb.py"
      - "nox/artifacts/"
      - "tests/cube/"
  done_when:
    - "endpoint returns cube artifacts; viewer test asserts presence"
  completion_notes:
    - "✅ nox/artifacts/cubes.py module created with full cube generation"
    - "✅ HOMO/LUMO generation functions implemented"
    - "✅ Cube file validation and metadata extraction"
    - "✅ XTB runner integration with generate_cubes_from_molden"
    - "✅ API schema includes 'cubes' parameter in XTBParams"
    - "✅ Comprehensive test suite with 8 passing tests"
    - "✅ PlaceHolder cube generation for environments without tools"
    - "✅ Production ready - jobs with cubes=true generate .cube artifacts"


name: Python CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'

jobs:
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - name: Setup Python
        uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          install-dev-deps: 'true'
      
      - name: Install linting tools
        run: |
          pip install black isort flake8 ruff
      
      - name: Run Black
        run: black --check api/ tests/
        continue-on-error: true
      
      - name: Run isort
        run: isort --check-only api/ tests/
        continue-on-error: true
      
      - name: Run flake8
        run: flake8 api/ tests/
        continue-on-error: true
      
      - name: Run Ruff
        run: ruff check api/ tests/
        continue-on-error: true

  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - name: Setup Python
        uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install security tools
        run: |
          pip install bandit safety pip-audit
      
      - name: Run Bandit
        run: |
          bandit -r api/ -f json -o bandit-report.json
          bandit -r api/
        continue-on-error: true
      
      - name: Run Safety
        run: |
          safety check --json --output safety-report.json
          safety check
        continue-on-error: true
      
      - name: Run pip-audit
        run: |
          pip-audit --format json --output pip-audit-report.json
          pip-audit
        continue-on-error: true
      
      - name: Upload Security Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json
            pip-audit-report.json
          retention-days: 30

  test:
    name: Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_USER: test_user
          POSTGRES_DB: nox_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
      - uses: actions/checkout@v5
      
      - name: Setup Python
        uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          install-dev-deps: 'true'
      
      - name: Setup Test Database
        uses: ./.github/actions/setup-test-db
        with:
          database-url: postgresql://test_user:test_password@localhost:5432/nox_test
          pg-password: test_password
      
      - name: Run tests
        run: |
          python -m pytest tests/ -v --cov=. --cov-report=xml --cov-report=html
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/nox_test
          JWT_SECRET_KEY: test_secret_key_for_ci
          NOX_API_HOST: "0.0.0.0"
          NOX_API_PORT: "8000"
          PG_PRIMARY_HOST: "localhost"
          PG_REPLICA1_HOST: "localhost"
          PG_REPLICA2_HOST: "localhost"
          REDIS_URL: "redis://localhost:6379/0"
          JOBS_FORCE_LOCAL: "true"
          DISABLE_MULTINODE: "true"
          CI_ENVIRONMENT: "true"
      
      - name: Upload Coverage Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage.xml
            htmlcov/
          retention-days: 30

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5
      
      - name: Setup Python
        uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Generate SBOM (pip freeze)
        run: |
          pip freeze > requirements-frozen.txt
          echo "Dependencies captured in requirements-frozen.txt"
      
      - name: Create SBOM JSON
        run: |
          python -c "
          import json
          import sys
          import uuid
          from datetime import datetime
          
          sbom = {
            'bomFormat': 'CycloneDX',
            'specVersion': '1.4',
            'serialNumber': 'urn:uuid:' + str(uuid.uuid4()),
            'version': 1,
            'metadata': {
              'timestamp': datetime.utcnow().isoformat() + 'Z',
              'component': {
                'type': 'application',
                'name': 'nox-api',
                'version': '0.1.0'
              }
            },
            'components': []
          }
          
          with open('requirements-frozen.txt', 'r') as f:
            for line in f:
              line = line.strip()
              if line and not line.startswith('#'):
                parts = line.split('==')
                if len(parts) == 2:
                  sbom['components'].append({
                    'type': 'library',
                    'name': parts[0],
                    'version': parts[1]
                  })
          
          with open('sbom.json', 'w') as f:
            json.dump(sbom, f, indent=2)
          
          print('SBOM generated successfully')
          "
        continue-on-error: true
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            sbom.json
            requirements-frozen.txt
          retention-days: 90

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [lint, security, test, sbom]
    if: always()
    steps:
      - name: Check Results
        run: |
          echo "## CI Summary"
          echo ""
          echo "Lint: ${{ needs.lint.result }}"
          echo "Security: ${{ needs.security.result }}"
          echo "Tests: ${{ needs.test.result }}"
          echo "SBOM: ${{ needs.sbom.result }}"
          echo ""
          
          if [ "${{ needs.lint.result }}" = "success" ] && [ "${{ needs.security.result }}" = "success" ] && [ "${{ needs.test.result }}" = "success" ]; then
            echo "✅ All critical checks passed!"
            exit 0
          else
            echo "⚠️ Some checks did not pass. Please review the results above."
            exit 0
          fi

name: lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  run-linters:
    name: Run linters
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python dependencies
        run: pip install black==24.10.0 flake8

      - name: Run black and flake8
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          mapfile -t files < <(git diff --name-only "$base" "$GITHUB_SHA" -- '*.py')
          if [ "${#files[@]}" -gt 0 ]; then
            black --check "${files[@]}"
            flake8 "${files[@]}"
          else
            echo "No changed Python files to lint."
          fi

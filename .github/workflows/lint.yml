name: lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  run-linters:
    name: Run linters
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r dev-requirements.txt

      - name: Run scoped Python lint
        run: |
          paths="api/services/queue.py workers/jobs_worker.py"
          if [ -d chemlab ]; then
            paths="$paths chemlab"
          fi
          black --check $paths
          flake8 $paths --max-line-length=100
